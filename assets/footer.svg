<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b" />
      <stop offset="50%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#140a0d" />
    </linearGradient>
    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="106" rx="14" fill="url(#footer-bg)" stroke="#1f2430" stroke-width="1" />

  <!-- Glowing divider line -->
  <line x1="150" y1="2" x2="1050" y2="2" stroke="url(#line-glow)" stroke-width="2" />

  <!-- Text -->
  <text x="600" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f3f4f6" text-anchor="middle">
    Thanks for exploring my GitHub profile! <tspan fill="#ef4444">Let's connect &amp; build something impactful.</tspan> 🚀
  </text>
  <text x="600" y="80" font-family="'Fira Code', monospace" font-size="12" fill="#9ca3af" text-anchor="middle">
    © 2026 Mohammed Zain J • Mysuru, Karnataka, India
