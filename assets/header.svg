<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b" />
      <stop offset="50%" stop-color="#0d0f14" />
      <stop offset="100%" stop-color="#140a0c" />
    </linearGradient>

    <!-- Accent Red Gradient -->
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b55" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.4" />
    </linearGradient>

    <!-- Radial Glow Behind Title -->
    <radialGradient id="center-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#ef4444" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.035" />
      <circle cx="40" cy="40" r="1" fill="#ef4444" fill-opacity="0.18" />
    </pattern>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-weight: 900; letter-spacing: 5px; fill: #ffffff; }
    .tagline { font-weight: 500; letter-spacing: 1.5px; fill: #9ca3af; }
    .badge-text { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; fill: #fca5a5; }
    .highlight { fill: url(#red-glow); font-weight: 800; }
  </style>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="1196" height="336" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.8" />

  <!-- Grid Overlay -->
  <rect x="2" y="2" width="1196" height="336" rx="20" fill="url(#tech-grid)" />

  <!-- Center Ambient Glow -->
  <circle cx="600" cy="165" r="280" fill="url(#center-glow)" />

  <!-- Top Status Badge -->
  <g transform="translate(600, 52)">
    <rect x="-195" y="-16" width="390" height="32" rx="16" fill="url(#badge-grad)" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="-172" cy="0" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="4" class="sans badge-text" text-anchor="middle">FULL-STACK MERN • AI &amp; INFORMATION SCIENCE</text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(600, 140)">
    <!-- Subtitle Glow effect behind text -->
    <text x="0" y="0" class="sans title" font-size="52" text-anchor="middle" fill="#ef4444" opacity="0.3" filter="url(#glow-filter)">MOHAMMED ZAIN J</text>
    <text x="0" y="0" class="sans title" font-size="52" text-anchor="middle">MOHAMMED ZAIN J</text>
  </g>

  <!-- Tagline / Bio -->
  <g transform="translate(600, 195)">
    <text x="0" y="0" class="sans tagline" font-size="18" text-anchor="middle">
      <tspan class="highlight">Full-Stack Developer</tspan>
      <tspan fill="#4b5563"> • </tspan>
      <tspan fill="#e5e7eb">Gemini AI Integrator</tspan>
      <tspan fill="#4b5563"> • </tspan>
      <tspan fill="#e5e7eb">Technical SEO &amp; Performance</tspan>
    </text>
  </g>

  <!-- Skills / Tech Capsule Pills -->
  <g transform="translate(600, 260)">
    <!-- Tag 1 -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="-14" width="130" height="28" rx="14" fill="#181822" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1" />
      <text x="65" y="4" class="mono" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">⚛️ React.js</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(-245, 0)">
      <rect x="0" y="-14" width="125" height="28" rx="14" fill="#181822" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1" />
      <text x="62" y="4" class="mono" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">🟢 Node.js</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(-105, 0)">
      <rect x="0" y="-14" width="135" height="28" rx="14" fill="#181822" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1" />
      <text x="67" y="4" class="mono" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">🍃 MongoDB</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(45, 0)">
      <rect x="0" y="-14" width="150" height="28" rx="14" fill="#181822" stroke="#ef4444" stroke-opacity="0.45" stroke-width="1" />
      <text x="75" y="4" class="mono" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">🤖 Gemini API</text>
    </g>

    <!-- Tag 5 -->
    <g transform="translate(210, 0)">
      <rect x="0" y="-14" width="135" height="28" rx="14" fill="#181822" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1" />
      <text x="67" y="4" class="mono" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">⚡ Socket.io</text>
    </g>

    <!-- Tag 6 -->
    <g transform="translate(360, 0)">
      <rect x="0" y="-14" width="115" height="28" rx="14" fill="#181822" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1" />
      <text x="57" y="4" class="mono" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="middle">📍 Mysuru</text>
    </g>
  </g>

  <!-- Modern Corner Accent Brackets -->
  <path d="M 22 45 L 22 22 L 45 22" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.75" />
  <path d="M 1178 45 L 1178 22 L 1155 22" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.75" />
  <path d="M 22 295 L 22 318 L 45 318" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.75" />
  <path d="M 1178 295 L 1178 318 L 1155 318" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.75" />
</svg>
