<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="100%">
  <defs>
    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#140a0d" />
    </linearGradient>
    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#374151" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="146" rx="14" fill="url(#quote-bg)" stroke="url(#quote-border)" stroke-width="1.4" />

  <!-- Quote mark icon -->
  <text x="50" y="70" font-family="'Georgia', serif" font-size="70" fill="#ef4444" opacity="0.35">“</text>

  <!-- Quote Text -->
  <text x="90" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic" fill="#e5e7eb" font-weight="400">
    "Passionate about solving real-world problems through clean, practical solutions,
  </text>
  <text x="90" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic" fill="#e5e7eb" font-weight="400">
    integrating intelligent AI capabilities, and engineering high-performance web architectures."
  </text>

  <!-- Author -->
  <text x="830" y="124" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#ef4444" text-anchor="end">
    — Mohammed Zain J
  </text>
</svg>
